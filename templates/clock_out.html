{% extends "base.html" %}
{% block title %}Clock Out — WorkTrace{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-header form-header-out">
      <span class="form-icon">🔴</span>
      <h2>Clock Out</h2>
      <p>Enter your details to end your shift</p>
    </div>
    <form method="POST" action="{{ url_for('clock_out_form') }}" novalidate>
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" required autocomplete="name"
               value="{{ form_data.get('name', '') }}"
               placeholder="e.g. John Smith"/>
      </div>
      <div class="form-group">
        <label for="staff_id">Staff ID <span class="required">*</span></label>
        <input type="text" id="staff_id" name="staff_id" required autocomplete="one-time-code"
               value="{{ form_data.get('staff_id', '') }}"
               placeholder="e.g. S001"/>
      </div>
      <div class="form-group">
        <label for="position">Position</label>
        <input type="text" id="position" name="position" autocomplete="organization-title"
               value="{{ form_data.get('position', '') }}"
               placeholder="e.g. Cashier"/>
      </div>
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email"
               value="{{ form_data.get('email', '') }}"
               placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label for="end_time">End Time <span class="required">*</span></label>
        <input type="datetime-local" id="end_time" name="end_time" required
               value="{{ form_data.get('end_time', now.strftime('%Y-%m-%dT%H:%M')) }}"/>
      </div>
      <div class="form-group">
        <label for="rest_minutes">Rest / Break Time (minutes)</label>
        <input type="number" id="rest_minutes" name="rest_minutes" min="0" step="1"
               value="{{ form_data.get('rest_minutes', '0') }}"
               placeholder="e.g. 30"/>
        <small class="form-hint">Total break or rest time taken during the shift.</small>
      </div>
      <button type="submit" class="btn btn-danger btn-full">Submit Clock-Out ✓</button>
    </form>
  </div>
</div>
{% endblock %}
